<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard React</title>
  
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="https://unpkg.com/prop-types/prop-types.js"></script>
  <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #091a12; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #091a12; }
    ::-webkit-scrollbar-thumb { background: #2d5a3d; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;
    const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, ReferenceLine } = window.Recharts;

    // ── Suits & palette ──────────────────────────────────────────────────────────
    const SUITS = ["♠", "♥", "♦", "♣", "♠", "♥", "♦", "♣", "♠", "♥"];
    const SUIT_COLORS = [
      { suit: "♠", bg: "#E2E8F0", text: "#1e293b", accent: "#94a3b8" },
      { suit: "♥", bg: "#FCA5A5", text: "#7f1d1d", accent: "#ef4444" },
      { suit: "♦", bg: "#FCD34D", text: "#78350f", accent: "#f59e0b" },
      { suit: "♣", bg: "#86EFAC", text: "#14532d", accent: "#22c55e" },
      { suit: "♠", bg: "#C4B5FD", text: "#2e1065", accent: "#8b5cf6" },
      { suit: "♥", bg: "#FDA4AF", text: "#881337", accent: "#f43f5e" },
      { suit: "♦", bg: "#FDE68A", text: "#713f12", accent: "#d97706" },
      { suit: "♣", bg: "#6EE7B7", text: "#064e3b", accent: "#10b981" },
      { suit: "♠", bg: "#BAE6FD", text: "#0c4a6e", accent: "#0ea5e9" },
      { suit: "♥", bg: "#FBCFE8", text: "#831843", accent: "#ec4899" },
    ];

    const totalScore = (rounds, pid) => rounds.reduce((s, r) => s + (r.scores[pid] ?? 0), 0);

    // ── Felt texture overlay ──────────────────────────────────────────────────────
    function FeltBg() {
      return (
        <div style={{
          position: "fixed", inset: 0, zIndex: 0,
          background: "radial-gradient(ellipse at 50% 30%, #1a4731 0%, #0f2d1e 55%, #091a12 100%)",
          overflow: "hidden",
        }}>
          <svg style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: 0.08 }}>
            <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" /><feColorMatrix type="saturate" values="0" /></filter>
            <rect width="100%" height="100%" filter="url(#noise)" />
          </svg>
          {["♠","♥","♦","♣"].map((s, i) => (
            <div key={i} style={{
              position: "absolute",
              top: i < 2 ? "16px" : "auto", bottom: i >= 2 ? "16px" : "auto",
              left: i % 2 === 0 ? "20px" : "auto", right: i % 2 === 1 ? "20px" : "auto",
              fontSize: "48px", color: i % 2 === 1 ? "#b91c1c44" : "#ffffff10",
              lineHeight: 1, userSelect: "none", pointerEvents: "none",
            }}>{s}</div>
          ))}
        </div>
      );
    }

    // ── Player card ───────────────────────────────────────────────────────────────
    function PlayerCard({ player, colorInfo, rank, total, onNameChange }) {
      const [editing, setEditing] = useState(false);
      const [val, setVal] = useState(player.name);
      const ref = useRef();
      useEffect(() => { if (editing) ref.current?.select(); }, [editing]);
      const commit = () => { onNameChange(val || player.name); setEditing(false); };

      const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : null;

      return (
        <div style={{
          background: colorInfo.bg, borderRadius: "12px", padding: "14px 12px 12px",
          position: "relative",
          boxShadow: rank === 1 ? `0 0 0 3px ${colorInfo.accent}, 0 8px 32px #00000060` : "0 4px 20px #00000050",
          display: "flex", flexDirection: "column", alignItems: "center", gap: "6px",
          minWidth: 0, transition: "transform 0.2s",
        }}>
          <div style={{ position: "absolute", top: "5px", left: "7px", fontSize: "13px", color: colorInfo.text, opacity: 0.5, lineHeight: 1 }}>{colorInfo.suit}</div>
          <div style={{ position: "absolute", bottom: "5px", right: "7px", fontSize: "13px", color: colorInfo.text, opacity: 0.5, lineHeight: 1, transform: "rotate(180deg)" }}>{colorInfo.suit}</div>
          {medal && <div style={{ position: "absolute", top: "4px", right: "6px", fontSize: "14px" }}>{medal}</div>}
          <div style={{ fontSize: "28px", lineHeight: 1, color: colorInfo.text, opacity: 0.85 }}>{colorInfo.suit}</div>

          {editing ? (
            <input ref={ref} value={val} onChange={e => setVal(e.target.value)} onBlur={commit}
              onKeyDown={e => { if (e.key === "Enter") commit(); if (e.key === "Escape") setEditing(false); }}
              style={{
                background: "rgba(0,0,0,0.1)", border: `1.5px solid ${colorInfo.accent}`,
                borderRadius: "5px", color: colorInfo.text, fontSize: "11px",
                fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 700,
                textAlign: "center", width: "100%", padding: "2px 4px", outline: "none",
              }}
            />
          ) : (
            <div onClick={() => { setVal(player.name); setEditing(true); }}
              style={{
                fontSize: "11px", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 700,
                color: colorInfo.text, cursor: "pointer", textAlign: "center",
                borderBottom: `1px dashed ${colorInfo.accent}88`,
                overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap",
                maxWidth: "100%", lineHeight: 1.4,
              }}
            >{player.name}</div>
          )}

          <div style={{ fontSize: "32px", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 900, color: colorInfo.text, lineHeight: 1, letterSpacing: "-1px" }}>{total}</div>
          <div style={{ fontSize: "9px", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", color: colorInfo.text, opacity: 0.5, letterSpacing: "0.1em", textTransform: "uppercase" }}>pts</div>
        </div>
      );
    }

    // ── Score evolution chart ─────────────────────────────────────────────────────
    function EvolutionChart({ players, rounds }) {
      if (rounds.length === 0) return (
        <div style={{ textAlign: "center", color: "#2d5a3d", fontSize: "13px", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", padding: "20px 0", fontStyle: "italic" }}>
          Aucune manche — le graphique apparaîtra ici
        </div>
      );

      const data = rounds.map((_, ri) => {
        const point = { round: `M${ri + 1}` };
        players.forEach(p => {
          let acc = 0;
          for (let j = 0; j <= ri; j++) acc += rounds[j].scores[p.id] ?? 0;
          point[p.id] = acc;
        });
        return point;
      });

      const CustomTooltip = ({ active, payload, label }) => {
        if (!active || !payload?.length) return null;
        return (
          <div style={{ background: "#0f2d1e", border: "1px solid #2d5a3d", borderRadius: "8px", padding: "8px 12px" }}>
            <div style={{ fontSize: "10px", color: "#4ade80", marginBottom: "4px", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif" }}>{label}</div>
            {[...payload].sort((a, b) => b.value - a.value).map(entry => {
              const pi = players.findIndex(p => p.id === entry.dataKey);
              const ci = SUIT_COLORS[pi % SUIT_COLORS.length];
              return (
                <div key={entry.dataKey} style={{ display: "flex", gap: "6px", alignItems: "center", fontSize: "12px", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif" }}>
                  <span style={{ color: ci.accent }}>{ci.suit}</span>
                  <span style={{ color: "#ccc" }}>{players.find(p => p.id === entry.dataKey)?.name}</span>
                  <span style={{ color: "#fff", fontWeight: 700, marginLeft: "auto", paddingLeft: "8px" }}>{entry.value}</span>
                </div>
              );
            })}
          </div>
        );
      };

      return (
        <ResponsiveContainer width="100%" height={180}>
          <LineChart data={data} margin={{ top: 8, right: 8, left: -20, bottom: 0 }}>
            <XAxis dataKey="round" tick={{ fill: "#2d5a3d", fontSize: 10, fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif" }} axisLine={false} tickLine={false} />
            <YAxis tick={{ fill: "#2d5a3d", fontSize: 9, fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif" }} axisLine={false} tickLine={false} />
            <ReferenceLine y={0} stroke="#2d5a3d" strokeDasharray="3 3" />
            <Tooltip content={<CustomTooltip />} />
            {players.map((p, i) => (
              <Line key={p.id} type="monotone" dataKey={p.id} stroke={SUIT_COLORS[i % SUIT_COLORS.length].accent} strokeWidth={2} dot={{ fill: SUIT_COLORS[i % SUIT_COLORS.length].accent, r: 3 }} activeDot={{ r: 5 }} />
            ))}
          </LineChart>
        </ResponsiveContainer>
      );
    }

    // ── Round input ───────────────────────────────────────────────────────────────
    function RoundInput({ players, roundNumber, onValidate }) {
      const [inputs, setInputs] = useState(() => Object.fromEntries(players.map(p => [p.id, ""])));
      const refs = useRef({});
      useEffect(() => { setInputs(Object.fromEntries(players.map(p => [p.id, ""]))); }, [players.length]);

      const set = (id, v) => { if (v === "" || v === "-" || /^-?\d*$/.test(v)) setInputs(p => ({ ...p, [id]: v })); };

      const handleKey = (e, idx) => {
        if (e.key === "Enter" || e.key === "Tab") {
          e.preventDefault();
          const next = players[idx + 1];
          if (next) refs.current[next.id]?.focus(); else validate();
        }
      };

      const validate = () => {
        const scores = {};
        players.forEach(p => { scores[p.id] = parseInt(inputs[p.id], 10) || 0; });
        onValidate(scores);
        setInputs(Object.fromEntries(players.map(p => [p.id, ""])));
        refs.current[players[0].id]?.focus();
      };

      const allEmpty = players.every(p => inputs[p.id] === "");

      return (
        <div style={{ background: "rgba(0,0,0,0.35)", border: "1px solid #2d5a3d", borderRadius: "14px", overflow: "hidden", boxShadow: "inset 0 1px 0 #4ade8020" }}>
          <div style={{ background: "rgba(0,0,0,0.3)", borderBottom: "1px solid #2d5a3d", padding: "10px 16px", display: "flex", alignItems: "center", gap: "10px" }}>
            <span style={{ fontSize: "18px" }}>🃏</span>
            <span style={{ fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 700, color: "#4ade80", fontSize: "14px", letterSpacing: "0.04em" }}>Manche {roundNumber}</span>
          </div>

          <div style={{ padding: "14px 16px", display: "flex", flexDirection: "column", gap: "10px" }}>
            {players.map((p, i) => {
              const ci = SUIT_COLORS[i % SUIT_COLORS.length];
              return (
                <div key={p.id} style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                  <div style={{ width: "22px", fontSize: "16px", textAlign: "center", color: ci.accent, flexShrink: 0 }}>{ci.suit}</div>
                  <div style={{ flex: 1, fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 700, fontSize: "13px", color: "#a7f3d0", textTransform: "uppercase", letterSpacing: "0.04em", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</div>
                  <input ref={el => refs.current[p.id] = el} type="text" inputMode="numeric" placeholder="0" value={inputs[p.id]} onChange={e => set(p.id, e.target.value)} onKeyDown={e => handleKey(e, i)}
                    style={{ width: "80px", background: `${ci.accent}18`, border: `1.5px solid ${ci.accent}55`, borderRadius: "8px", color: ci.accent, fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 700, fontSize: "16px", textAlign: "center", padding: "6px 8px", outline: "none", flexShrink: 0 }}
                    onFocus={e => e.target.style.borderColor = ci.accent} onBlur={e => e.target.style.borderColor = `${ci.accent}55`} />
                </div>
              );
            })}
          </div>

          <div style={{ padding: "12px 16px", borderTop: "1px solid #2d5a3d22", display: "flex", justifyContent: "flex-end" }}>
            <button onClick={validate} disabled={allEmpty} style={{ padding: "10px 28px", borderRadius: "8px", background: allEmpty ? "#1a3326" : "linear-gradient(135deg, #4ade80, #22c55e)", border: allEmpty ? "1px solid #2d5a3d" : "none", color: allEmpty ? "#2d5a3d" : "#052e16", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 700, fontSize: "13px", cursor: allEmpty ? "default" : "pointer", letterSpacing: "0.06em", boxShadow: allEmpty ? "none" : "0 4px 16px #4ade8044", transition: "all 0.2s" }}>✦ VALIDER</button>
          </div>
        </div>
      );
    }

    // ── History table ─────────────────────────────────────────────────────────────
    function HistoryTable({ rounds, players, onDelete }) {
      const [confirmDel, setConfirmDel] = useState(null);
      if (rounds.length === 0) return <div style={{ textAlign: "center", color: "#2d5a3d", fontStyle: "italic", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", padding: "20px 0" }}>Aucune manche enregistrée</div>;
      
      const totals = players.map(p => totalScore(rounds, p.id));
      const maxTotal = Math.max(...totals);

      return (
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "12px", minWidth: `${players.length * 72 + 80}px` }}>
            <thead>
              <tr>
                <th style={{ ...thS, color: "#2d5a3d", width: "46px" }}>#</th>
                {players.map((p, i) => <th key={p.id} style={{ ...thS, color: SUIT_COLORS[i % SUIT_COLORS.length].accent }}>{SUIT_COLORS[i % SUIT_COLORS.length].suit} {p.name}</th>)}
                <th style={{ ...thS, width: "28px" }} />
              </tr>
            </thead>
            <tbody>
              {rounds.map((r, ri) => {
                const rowMax = Math.max(...players.map(p => r.scores[p.id] ?? 0));
                return (
                  <tr key={r.id} style={{ borderBottom: "1px solid #1a3326" }}>
                    <td style={{ ...tdS, color: "#2d5a3d", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif" }}>M{ri + 1}</td>
                    {players.map((p, i) => {
                      const v = r.scores[p.id] ?? 0;
                      const best = v === rowMax && rowMax > 0;
                      return <td key={p.id} style={{ ...tdS, fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", color: best ? SUIT_COLORS[i % SUIT_COLORS.length].accent : "#3d7a52", fontWeight: best ? 700 : 400 }}>{v > 0 ? `+${v}` : v}</td>;
                    })}
                    <td style={{ ...tdS, padding: "3px" }}>
                      {confirmDel === r.id
                        ? <button onClick={() => { onDelete(r.id); setConfirmDel(null); }} style={{ background: "#7f1d1d", border: "none", borderRadius: "4px", color: "#fca5a5", fontSize: "9px", padding: "2px 6px", cursor: "pointer" }}>✕</button>
                        : <button onClick={() => setConfirmDel(r.id)} style={{ background: "transparent", border: "none", color: "#1a3326", fontSize: "16px", cursor: "pointer", lineHeight: 1 }}>×</button>}
                    </td>
                  </tr>
                );
              })}
              <tr style={{ borderTop: "2px solid #2d5a3d" }}>
                <td style={{ ...tdS, color: "#4ade80", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 700, fontSize: "10px", letterSpacing: "0.08em" }}>TOTAL</td>
                {players.map((p, i) => {
                  const t = totals[i];
                  const win = t === maxTotal && maxTotal > 0;
                  return <td key={p.id} style={{ ...tdS, fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 700, fontSize: "15px", color: win ? SUIT_COLORS[i % SUIT_COLORS.length].accent : "#4ade8088" }}>{win ? "🏆 " : ""}{t}</td>;
                })}
                <td />
              </tr>
            </tbody>
          </table>
        </div>
      );
    }

    const thS = { padding: "7px 8px", textAlign: "center", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 700, fontSize: "10px", letterSpacing: "0.08em", textTransform: "uppercase", borderBottom: "1px solid #2d5a3d" };
    const tdS = { padding: "7px 8px", textAlign: "center" };

    // ── Setup screen ──────────────────────────────────────────────────────────────
    function SetupScreen({ onStart }) {
      const [count, setCount] = useState(4);
      const [names, setNames] = useState(Array.from({ length: 10 }, (_, i) => `Joueur ${i + 1}`));
      const setName = (i, v) => setNames(prev => prev.map((n, j) => j === i ? v : n));

      return (
        <div style={{ minHeight: "100vh", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "32px 16px", position: "relative", zIndex: 1 }}>
          <div style={{ display: "flex", gap: "12px", marginBottom: "20px", fontSize: "28px" }}>
            {["♠","♥","♦","♣"].map((s, i) => <span key={i} style={{ color: i % 2 === 1 ? "#ef4444" : "#e2e8f0", opacity: 0.9 }}>{s}</span>)}
          </div>
          <div style={{ fontSize: "10px", letterSpacing: "0.35em", color: "#4ade8066", textTransform: "uppercase", marginBottom: "6px", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif" }}>Nouvelle partie</div>
          <h1 style={{ fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 900, fontSize: "clamp(30px, 7vw, 48px)", color: "#f0fdf4", letterSpacing: "0.04em", marginBottom: "8px", textShadow: "0 0 40px #4ade8044" }}>SCOREBOARD</h1>
          <div style={{ fontSize: "11px", color: "#2d5a3d", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontStyle: "italic", marginBottom: "32px" }}>Jeux de cartes · Compteur de points</div>

          <div style={{ marginBottom: "24px", textAlign: "center" }}>
            <div style={{ fontSize: "10px", letterSpacing: "0.2em", color: "#2d5a3d", textTransform: "uppercase", marginBottom: "12px", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif" }}>Nombre de joueurs</div>
            <div style={{ display: "flex", gap: "8px", flexWrap: "wrap", justifyContent: "center" }}>
              {[2,3,4,5,6,7,8,9,10].map(n => {
                const ci = SUIT_COLORS[(n - 2) % SUIT_COLORS.length];
                return <button key={n} onClick={() => setCount(n)} style={{ width: "42px", height: "42px", borderRadius: "8px", border: count === n ? `2px solid ${ci.accent}` : "2px solid #1a3326", background: count === n ? `${ci.accent}22` : "#0f2d1e", color: count === n ? ci.accent : "#2d5a3d", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 700, fontSize: "16px", cursor: "pointer", transition: "all 0.15s" }}>{n}</button>;
              })}
            </div>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: count <= 4 ? "1fr 1fr" : count <= 6 ? "1fr 1fr 1fr" : "1fr 1fr 1fr 1fr", gap: "10px", width: "100%", maxWidth: "540px", marginBottom: "28px" }}>
            {Array.from({ length: count }, (_, i) => {
              const ci = SUIT_COLORS[i % SUIT_COLORS.length];
              return (
                <div key={i} style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                  <span style={{ fontSize: "16px", color: ci.accent, flexShrink: 0 }}>{ci.suit}</span>
                  <input value={names[i]} onChange={e => setName(i, e.target.value)} placeholder={`Joueur ${i + 1}`}
                    style={{ background: `${ci.accent}12`, border: `1.5px solid ${ci.accent}44`, borderRadius: "8px", color: "#a7f3d0", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 700, fontSize: "12px", padding: "7px 10px", outline: "none", width: "100%" }}
                    onFocus={e => e.target.style.borderColor = ci.accent} onBlur={e => e.target.style.borderColor = `${ci.accent}44`} />
                </div>
              );
            })}
          </div>

          <button onClick={() => onStart(count, names.slice(0, count))} style={{ padding: "14px 48px", borderRadius: "10px", background: "linear-gradient(135deg, #4ade80, #22c55e)", border: "none", color: "#052e16", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 900, fontSize: "16px", cursor: "pointer", letterSpacing: "0.08em", boxShadow: "0 6px 24px #4ade8055" }}>✦ COMMENCER LA PARTIE</button>
        </div>
      );
    }

    // ── Main App ──────────────────────────────────────────────────────────────────
    function App() {
      const [gameStarted, setGameStarted] = useState(false);
      const [players, setPlayers] = useState([]);
      const [rounds, setRounds] = useState([]);
      const [tab, setTab] = useState("saisie");
      const [confirmReset, setConfirmReset] = useState(false);
      const nextId = useRef(0);

      const startGame = (count, names) => { setPlayers(names.map((name, i) => ({ name, id: i }))); nextId.current = 0; setRounds([]); setTab("saisie"); setGameStarted(true); };
      const updateName = (id, name) => setPlayers(prev => prev.map(p => p.id === id ? { ...p, name } : p));
      const addRound = scores => { setRounds(prev => [...prev, { id: nextId.current++, scores }]); setTab("graph"); };
      const deleteRound = id => setRounds(prev => prev.filter(r => r.id !== id));
      const reset = () => { setRounds([]); setPlayers([]); setGameStarted(false); setConfirmReset(false); };

      const ranked = [...players].sort((a, b) => totalScore(rounds, b.id) - totalScore(rounds, a.id));
      const getRank = id => ranked.findIndex(p => p.id === id) + 1;

      return (
        <>
          <FeltBg />
          {!gameStarted ? <SetupScreen onStart={startGame} /> : (
            <div style={{ position: "relative", zIndex: 1, maxWidth: "900px", margin: "0 auto", padding: "20px 16px 60px" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "20px" }}>
                <button onClick={() => setConfirmReset(true)} style={{ background: "transparent", border: "1px solid #1a3326", borderRadius: "7px", color: "#2d5a3d", cursor: "pointer", fontSize: "11px", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 700, padding: "6px 12px", letterSpacing: "0.05em" }}>← Retour</button>
                <div style={{ textAlign: "center" }}>
