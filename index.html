<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scoreboard React - Tarot</title>
  
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/prop-types/prop-types.js"></script>
  <script src="https://unpkg.com/recharts@2.1.9/umd/Recharts.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #091a12; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #091a12; }
    ::-webkit-scrollbar-thumb { background: #2d5a3d; border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;
    const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, ReferenceLine } = window.Recharts;

    const SUITS = ["♠", "♥", "♦", "♣", "♠", "♥", "♦", "♣", "♠", "♥"];
    const SUIT_COLORS = [
      { suit: "♠", bg: "#E2E8F0", text: "#1e293b", accent: "#94a3b8" },
      { suit: "♥", bg: "#FCA5A5", text: "#7f1d1d", accent: "#ef4444" },
      { suit: "♦", bg: "#FCD34D", text: "#78350f", accent: "#f59e0b" },
      { suit: "♣", bg: "#86EFAC", text: "#14532d", accent: "#22c55e" },
      { suit: "♠", bg: "#C4B5FD", text: "#2e1065", accent: "#8b5cf6" },
      { suit: "♥", bg: "#FDA4AF", text: "#881337", accent: "#f43f5e" },
      { suit: "♦", bg: "#FDE68A", text: "#713f12", accent: "#d97706" },
      { suit: "♣", bg: "#6EE7B7", text: "#064e3b", accent: "#10b981" },
      { suit: "♠", bg: "#BAE6FD", text: "#0c4a6e", accent: "#0ea5e9" },
      { suit: "♥", bg: "#FBCFE8", text: "#831843", accent: "#ec4899" },
    ];

    const totalScore = (rounds, pid) => rounds.reduce((s, r) => s + (r.scores[pid] ?? 0), 0);

    function FeltBg() {
      return (
        <div style={{ position: "fixed", inset: 0, zIndex: 0, background: "radial-gradient(ellipse at 50% 30%, #1a4731 0%, #0f2d1e 55%, #091a12 100%)", overflow: "hidden" }}>
          <svg style={{ position: "absolute", inset: 0, width: "100%", height: "100%", opacity: 0.08 }}>
            <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" /><feColorMatrix type="saturate" values="0" /></filter>
            <rect width="100%" height="100%" filter="url(#noise)" />
          </svg>
          {["♠","♥","♦","♣"].map((s, i) => (
            <div key={i} style={{ position: "absolute", top: i < 2 ? "16px" : "auto", bottom: i >= 2 ? "16px" : "auto", left: i % 2 === 0 ? "20px" : "auto", right: i % 2 === 1 ? "20px" : "auto", fontSize: "48px", color: i % 2 === 1 ? "#b91c1c44" : "#ffffff10", lineHeight: 1, userSelect: "none", pointerEvents: "none" }}>{s}</div>
          ))}
        </div>
      );
    }

    function PlayerCard({ player, colorInfo, rank, total, onNameChange }) {
      const [editing, setEditing] = useState(false);
      const [val, setVal] = useState(player.name);
      const ref = useRef();
      useEffect(() => { if (editing) ref.current?.select(); }, [editing]);
      const commit = () => { onNameChange(val || player.name); setEditing(false); };
      const medal = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : null;

      return (
        <div style={{ background: colorInfo.bg, borderRadius: "12px", padding: "14px 12px 12px", position: "relative", boxShadow: rank === 1 ? `0 0 0 3px ${colorInfo.accent}, 0 8px 32px #00000060` : "0 4px 20px #00000050", display: "flex", flexDirection: "column", alignItems: "center", gap: "6px", minWidth: 0, transition: "transform 0.2s" }}>
          <div style={{ position: "absolute", top: "5px", left: "7px", fontSize: "13px", color: colorInfo.text, opacity: 0.5, lineHeight: 1 }}>{colorInfo.suit}</div>
          <div style={{ position: "absolute", bottom: "5px", right: "7px", fontSize: "13px", color: colorInfo.text, opacity: 0.5, lineHeight: 1, transform: "rotate(180deg)" }}>{colorInfo.suit}</div>
          {medal && <div style={{ position: "absolute", top: "4px", right: "6px", fontSize: "14px" }}>{medal}</div>}
          {player.avatar ? (
            <div style={{ width: "50px", height: "50px", borderRadius: "50%", overflow: "hidden", border: `2px solid ${colorInfo.accent}`, marginBottom: "4px", boxShadow: "0 4px 10px rgba(0,0,0,0.5)" }}>
              <img src={player.avatar} alt="Avatar" style={{ width: "100%", height: "100%", objectFit: "cover", filter: "contrast(1.3) saturate(1.2) sepia(0.4) hue-rotate(-10deg)" }} />
            </div>
          ) : (
            <div style={{ fontSize: "28px", lineHeight: 1, color: colorInfo.text, opacity: 0.85 }}>{colorInfo.suit}</div>
          )}

          {editing ? (
            <input ref={ref} value={val} onChange={e => setVal(e.target.value)} onBlur={commit} onKeyDown={e => { if (e.key === "Enter") commit(); if (e.key === "Escape") setEditing(false); }} style={{ background: "rgba(0,0,0,0.1)", border: `1.5px solid ${colorInfo.accent}`, borderRadius: "5px", color: colorInfo.text, fontSize: "11px", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 700, textAlign: "center", width: "100%", padding: "2px 4px", outline: "none" }} />
          ) : (
            <div onClick={() => { setVal(player.name); setEditing(true); }} style={{ fontSize: "11px", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 700, color: colorInfo.text, cursor: "pointer", textAlign: "center", borderBottom: `1px dashed ${colorInfo.accent}88`, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: "100%", lineHeight: 1.4 }}>{player.name}</div>
          )}
          <div style={{ fontSize: "32px", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", fontWeight: 900, color: colorInfo.text, lineHeight: 1, letterSpacing: "-1px" }}>{total}</div>
          <div style={{ fontSize: "9px", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", color: colorInfo.text, opacity: 0.5, letterSpacing: "0.1em", textTransform: "uppercase" }}>pts</div>
        </div>
      );
    }

    function EvolutionChart({ players, rounds }) {
      if (rounds.length === 0) return <div style={{ textAlign: "center", color: "#2d5a3d", fontSize: "13px", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif", padding: "20px 0", fontStyle: "italic" }}>Aucune manche — le graphique apparaîtra ici</div>;
      const data = rounds.map((_, ri) => {
        const point = { round: `M${ri + 1}` };
        players.forEach(p => { let acc = 0; for (let j = 0; j <= ri; j++) acc += rounds[j].scores[p.id] ?? 0; point[p.id] = acc; });
        return point;
      });

      const CustomTooltip = ({ active, payload, label }) => {
        if (!active || !payload?.length) return null;
        return (
          <div style={{ background: "#0f2d1e", border: "1px solid #2d5a3d", borderRadius: "8px", padding: "8px 12px" }}>
            <div style={{ fontSize: "10px", color: "#4ade80", marginBottom: "4px", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif" }}>{label}</div>
            {[...payload].sort((a, b) => b.value - a.value).map(entry => {
              const pi = players.findIndex(p => p.id === entry.dataKey);
              const ci = SUIT_COLORS[pi % SUIT_COLORS.length];
              return (
                <div key={entry.dataKey} style={{ display: "flex", gap: "6px", alignItems: "center", fontSize: "12px", fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif" }}>
                  <span style={{ color: ci.accent }}>{ci.suit}</span>
                  <span style={{ color: "#ccc" }}>{players.find(p => p.id === entry.dataKey)?.name}</span>
                  <span style={{ color: "#fff", fontWeight: 700, marginLeft: "auto", paddingLeft: "8px" }}>{entry.value}</span>
                </div>
              );
            })}
          </div>
        );
      };

      return (
        <ResponsiveContainer width="100%" height={180}>
          <LineChart data={data} margin={{ top: 8, right: 8, left: -20, bottom: 0 }}>
            <XAxis dataKey="round" tick={{ fill: "#2d5a3d", fontSize: 10, fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif" }} axisLine={false} tickLine={false} />
            <YAxis tick={{ fill: "#2d5a3d", fontSize: 9, fontFamily: "Tahoma, 'Trebuchet MS', Geneva, sans-serif" }} axisLine={false} tickLine={false} />
            <ReferenceLine y={0} stroke="#2d5a3d" strokeDasharray="3 3" />
            <Tooltip content={<CustomTooltip />} />
            {players.map((p, i) => <Line key={p.id} type="monotone" dataKey={p.id} stroke={SUIT_COLORS[i % SUIT_COLORS.length].accent} strokeWidth={2} dot={{ fill: SUIT_COLORS[i % SUIT_COLORS.length].accent, r: 3 }} activeDot={{ r: 5 }} />)}
          </LineChart>
        </ResponsiveContainer>
      );
    }

    // --- MODE LIBRE ----
    function RoundInputClassic({ players, roundNumber, onValidate }) {
      const [inputs, setInputs] = useState(() => Object.fromEntries(players.map(p => [p.id, ""])));
      const refs = useRef({});
      const set = (id, v) => { if (v === "" || v === "-" || /^-?\d*$/.test(v)) setInputs(p => ({ ...p, [id]: v })); };
      const validate = () => {
        const scores = {};
        players.forEach(p => { scores[p.id] = parseInt(inputs[p.id], 10) || 0; });
        onValidate(scores);
        setInputs(Object.fromEntries(players.map(p => [p.id, ""])));
        refs.current[players[0].id]?.focus();
      };
      const allEmpty = players.every(p => inputs[p.id] === "");

      return (
        <div style={{ background: "rgba(0,0,0,0.35)", border: "1px solid #2d5a3d", borderRadius: "14px", overflow: "hidden", boxShadow: "inset 0 1px 0 #4ade8020" }}>
          <div style={{ background: "rgba(0,0,0,0.3)", borderBottom: "1px solid #2d5a3d", padding: "10px 16px", display: "flex", alignItems: "center", gap: "10px" }}>
            <span style={{ fontSize: "18px" }}>🃏</span><span style={{ fontFamily: "Tahoma", fontWeight: 700, color: "#4ade80", fontSize: "14px" }}>Manche {roundNumber} (Libre)</span>
          </div>
          <div style={{ padding: "14px 16px", display: "flex", flexDirection: "column", gap: "10px" }}>
            {players.map((p, i) => {
              const ci = SUIT_COLORS[i % SUIT_COLORS.length];
              return (
                <div key={p.id} style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                  <div style={{ flex: 1, fontFamily: "Tahoma", fontWeight: 700, fontSize: "13px", color: ci.accent }}>{p.name}</div>
                  <input ref={el => refs.current[p.id] = el} type="text" placeholder="0" value={inputs[p.id]} onChange={e => set(p.id, e.target.value)}
                    onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); const next = players[i + 1]; if (next) refs.current[next.id]?.focus(); else validate(); } }}
                    style={{ width: "80px", background: `${ci.accent}18`, border: `1px solid ${ci.accent}55`, borderRadius: "8px", color: ci.accent, fontFamily: "Tahoma", fontWeight: 700, fontSize: "16px", textAlign: "center", padding: "6px" }} />
                </div>
              );
            })}
          </div>
          <div style={{ padding: "12px 16px", borderTop: "1px solid #2d5a3d22", display: "flex", justifyContent: "flex-end" }}>
            <button onClick={validate} disabled={allEmpty} style={{ padding: "10px 28px", borderRadius: "8px", background: allEmpty ? "#1a3326" : "#4ade80", border: "none", color: allEmpty ? "#2d5a3d" : "#052e16", fontFamily: "Tahoma", fontWeight: 700, cursor: allEmpty ? "default" : "pointer" }}>✦ VALIDER</button>
          </div>
        </div>
      );
    }

    // --- MODE TAROT ---
    function RoundInputTarot({ players, roundNumber, onValidate }) {
      const [preneur, setPreneur] = useState(players[0].id);
      const [partenaire, setPartenaire] = useState(players[0].id);
      const [contrat, setContrat] = useState(1); // 1:Petite, 2:Garde, 4:G-Sans, 6:G-Contre
      const [bouts, setBouts] = useState(0);
      const [points, setPoints] = useState("");

      const calculate = () => {
        const pts = parseInt(points, 10);
        if (isNaN(pts)) return;

        let target = 56;
        if (bouts === 1) target = 51;
        if (bouts === 2) target = 41;
        if (bouts === 3) target = 36;

        const diff = pts - target;
        const passed = diff >= 0;
        const baseScore = (Math.abs(diff) + 25) * contrat;
        const finalScore = passed ? baseScore : -baseScore;

        const scores = {};
        players.forEach(p => scores[p.id] = 0);

        if (players.length === 3) {
          players.forEach(p => { scores[p.id] = p.id === preneur ? finalScore * 2 : -finalScore; });
        } else if (players.length === 4) {
          players.forEach(p => { scores[p.id] = p.id === preneur ? finalScore * 3 : -finalScore; });
        } else if (players.length === 5) {
          players.forEach(p => {
            if (p.id === preneur && p.id === partenaire) scores[p.id] = finalScore * 4;
            else if (p.id === preneur) scores[p.id] = finalScore * 2;
            else if (p.id === partenaire) scores[p.id] = finalScore;
            else scores[p.id] = -finalScore;
          });
        }
        
        onValidate(scores);
        setPoints("");
      };

      const btnStyle = (active) => ({ padding: "6px 10px", borderRadius: "6px", fontFamily: "Tahoma", fontSize: "12px", fontWeight: 700, cursor: "pointer", border: active ? "1px solid #4ade80" : "1px solid #2d5a3d", background: active ? "#4ade8022" : "transparent", color: active ? "#4ade80" : "#2d5a3d" });

      return (
        <div style={{ background: "rgba(0,0,0,0.35)", border: "1px solid #2d5a3d", borderRadius: "14px", overflow: "hidden" }}>
          <div style={{ background: "rgba(0,0,0,0.3)", borderBottom: "1px solid #2d5a3d", padding: "10px 16px", display: "flex", alignItems: "center", gap: "10px" }}>
            <span style={{ fontSize: "18px" }}>🎴</span><span style={{ fontFamily: "Tahoma", fontWeight: 700, color: "#4ade80", fontSize: "14px" }}>Manche {roundNumber} (Calcul Tarot)</span>
          </div>
          
          <div style={{ padding: "16px", display: "flex", flexDirection: "column", gap: "16px" }}>
            {/* Rôles */}
            <div style={{ display: "flex", gap: "10px", flexWrap: "wrap" }}>
              <div style={{ flex: 1, minWidth: "140px" }}>
                <div style={{ fontSize: "10px", color: "#4ade8066", textTransform: "uppercase", marginBottom: "4px", fontFamily: "Tahoma" }}>Preneur</div>
                <select value={preneur} onChange={e => setPreneur(parseInt(e.target.value))} style={{ width: "100%", padding: "8px", borderRadius: "6px", background: "#0f2d1e", color: "#a7f3d0", border: "1px solid #2d5a3d", fontFamily: "Tahoma" }}>
                  {players.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              </div>
              {players.length === 5 && (
                <div style={{ flex: 1, minWidth: "140px" }}>
                  <div style={{ fontSize: "10px", color: "#4ade8066", textTransform: "uppercase", marginBottom: "4px", fontFamily: "Tahoma" }}>Partenaire (Appelé)</div>
                  <select value={partenaire} onChange={e => setPartenaire(parseInt(e.target.value))} style={{ width: "100%", padding: "8px", borderRadius: "6px", background: "#0f2d1e", color: "#a7f3d0", border: "1px solid #2d5a3d", fontFamily: "Tahoma" }}>
                    {players.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  </select>
                </div>
              )}
            </div>

            {/* Contrat & Bouts */}
            <div>
              <div style={{ fontSize: "10px", color: "#4ade8066", textTransform: "uppercase", marginBottom: "6px", fontFamily: "Tahoma" }}>Contrat</div>
              <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
                <button onClick={() => setContrat(1)} style={btnStyle(contrat === 1)}>Petite</button>
                <button onClick={() => setContrat(2)} style={btnStyle(contrat === 2)}>Garde</button>
                <button onClick={() => setContrat(4)} style={btnStyle(contrat === 4)}>G-Sans</button>
                <button onClick={() => setContrat(6)} style={btnStyle(contrat === 6)}>G-Contre</button>
              </div>
            </div>

            <div>
              <div style={{ fontSize: "10px", color: "#4ade8066", textTransform: "uppercase", marginBottom: "6px", fontFamily: "Tahoma" }}>Nombre de bouts (Oudlers)</div>
              <div style={{ display: "flex", gap: "6px" }}>
                {[0, 1, 2, 3].map(b => (
                  <button key={b} onClick={() => setBouts(b)} style={btnStyle(bouts === b)}>{b}</button>
                ))}
              </div>
            </div>

            {/* Points */}
            <div>
              <div style={{ fontSize: "10px", color: "#4ade8066", textTransform: "uppercase", marginBottom: "6px", fontFamily: "Tahoma" }}>Points réalisés par l'attaque (0 - 91)</div>
              <input type="number" value={points} onChange={e => setPoints(e.target.value)} placeholder="Ex: 42" onKeyDown={e => { if (e.key === "Enter") calculate(); }}
                style={{ width: "100px", background: "#1a473144", border: "1.5px solid #4ade8088", borderRadius: "8px", color: "#4ade80", fontFamily: "Tahoma", fontWeight: 700, fontSize: "16px", textAlign: "center", padding: "8px", outline: "none" }} />
            </div>
          </div>

          <div style={{ padding: "12px 16px", borderTop: "1px solid #2d5a3d22", display: "flex", justifyContent: "flex-end" }}>
            <button onClick={calculate} disabled={points === ""} style={{ padding: "10px 28px", borderRadius: "8px", background: points === "" ? "#1a3326" : "#4ade80", border: "none", color: points === "" ? "#2d5a3d" : "#052e16", fontFamily: "Tahoma", fontWeight: 700, cursor: points === "" ? "default" : "pointer" }}>✦ CALCULER & VALIDER</button>
          </div>
        </div>
      );
    }

    function HistoryTable({ rounds, players, onDelete }) {
      const [confirmDel, setConfirmDel] = useState(null);
      if (rounds.length === 0) return <div style={{ textAlign: "center", color: "#2d5a3d", fontStyle: "italic", fontFamily: "Tahoma", padding: "20px 0" }}>Aucune manche</div>;
      const totals = players.map(p => totalScore(rounds, p.id));
      const maxTotal = Math.max(...totals);

      return (
        <div style={{ overflowX: "auto" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: "12px", minWidth: `${players.length * 72 + 80}px` }}>
            <thead>
              <tr>
                <th style={{ padding: "7px 8px", color: "#2d5a3d", borderBottom: "1px solid #2d5a3d" }}>#</th>
                {players.map((p, i) => <th key={p.id} style={{ padding: "7px 8px", color: SUIT_COLORS[i % SUIT_COLORS.length].accent, borderBottom: "1px solid #2d5a3d", fontFamily: "Tahoma" }}>{p.name}</th>)}
                <th style={{ borderBottom: "1px solid #2d5a3d" }} />
              </tr>
            </thead>
            <tbody>
              {rounds.map((r, ri) => {
                const rowMax = Math.max(...players.map(p => r.scores[p.id] ?? 0));
                return (
                  <tr key={r.id} style={{ borderBottom: "1px solid #1a3326" }}>
                    <td style={{ padding: "7px 8px", textAlign: "center", color: "#2d5a3d", fontFamily: "Tahoma" }}>M{ri + 1}</td>
                    {players.map((p, i) => {
                      const v = r.scores[p.id] ?? 0;
                      const best = v === rowMax && rowMax > 0;
                      return <td key={p.id} style={{ padding: "7px 8px", textAlign: "center", fontFamily: "Tahoma", color: best ? SUIT_COLORS[i % SUIT_COLORS.length].accent : "#3d7a52", fontWeight: best ? 700 : 400 }}>{v > 0 ? `+${v}` : v}</td>;
                    })}
                    <td style={{ padding: "3px", textAlign: "center" }}>
                      {confirmDel === r.id ? <button onClick={() => { onDelete(r.id); setConfirmDel(null); }} style={{ background: "#7f1d1d", border: "none", borderRadius: "4px", color: "#fff", padding: "2px 6px" }}>✕</button> : <button onClick={() => setConfirmDel(r.id)} style={{ background: "transparent", border: "none", color: "#2d5a3d", fontSize: "16px", cursor: "pointer" }}>×</button>}
                    </td>
                  </tr>
                );
              })}
              <tr style={{ borderTop: "2px solid #2d5a3d" }}>
                <td style={{ padding: "7px 8px", textAlign: "center", color: "#4ade80", fontFamily: "Tahoma", fontWeight: 700 }}>TOT</td>
                {players.map((p, i) => {
                  const t = totals[i];
                  const win = t === maxTotal && maxTotal > 0;
                  return <td key={p.id} style={{ padding: "7px 8px", textAlign: "center", fontFamily: "Tahoma", fontWeight: 700, fontSize: "15px", color: win ? SUIT_COLORS[i % SUIT_COLORS.length].accent : "#4ade8088" }}>{win ? "🏆 " : ""}{t}</td>;
                })}
                <td />
              </tr>
            </tbody>
          </table>
        </div>
      );
    }

  function CameraCapture({ onCapture, onClose }) {
  const videoRef = React.useRef();

  React.useEffect(() => {
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => { if (videoRef.current) videoRef.current.srcObject = stream; })
      .catch(err => {
        alert("Impossible d'accéder à la caméra. Vérifiez vos permissions.");
        onClose();
      });

    return () => {
      const stream = videoRef.current?.srcObject;
      if (stream) stream.getTracks().forEach(t => t.stop());
    };
  }, [onClose]);

  const takePhoto = () => {
    const video = videoRef.current;
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");
    
    // Effet miroir et recadrage carré basique
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    onCapture(canvas.toDataURL("image/jpeg", 0.8));
  };

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 100, background: "rgba(0,0,0,0.85)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
      <div style={{ background: "#0f2d1e", padding: "16px", borderRadius: "12px", border: "2px solid #4ade80", textAlign: "center" }}>
        <div style={{ color: "#4ade80", fontFamily: "Tahoma", fontWeight: 700, marginBottom: "12px" }}>📸 Capture d'Avatar</div>

}

    function App() {
      const [gameStarted, setGameStarted] = useState(false);
      const [gameMode, setGameMode] = useState("libre");
      const [players, setPlayers] = useState([]);
      const [rounds, setRounds] = useState([]);
      const [tab, setTab] = useState("saisie");
      const [confirmReset, setConfirmReset] = useState(false);
      const nextId = useRef(0);

      const startGame = (count, names, mode) => { 
        if (mode === "belote") {
          // Fusionne les joueurs en 2 équipes
          setPlayers([
            { id: 0, name: `${names[0]} & ${names[1]}` },
            { id: 1, name: `${names[2]} & ${names[3]}` }
          ]);
        } else {
          setPlayers(names.map((data, i) => ({ 
            id: i, 
            name: data.type === "name" ? data.name : `Joueur ${i + 1}`, 
            avatar: data.type === "avatar" ? data.avatar : null 
          })));
        }
        
        setGameMode(mode);
        nextId.current = 0; setRounds([]); setTab("saisie"); setGameStarted(true); 
      };

      const updateName = (id, name) => setPlayers(prev => prev.map(p => p.id === id ? { ...p, name } : p));
      const addRound = scores => { setRounds(prev => [...prev, { id: nextId.current++, scores }]); setTab("historique"); };
      const deleteRound = id => setRounds(prev => prev.filter(r => r.id !== id));
      const reset = () => { setRounds([]); setPlayers([]); setGameStarted(false); setConfirmReset(false); };

      const ranked = [...players].sort((a, b) => totalScore(rounds, b.id) - totalScore(rounds, a.id));
      const getRank = id => ranked.findIndex(p => p.id === id) + 1;

      return (
        <>
          <FeltBg />
          {!gameStarted ? <SetupScreen onStart={startGame} /> : (
            <div style={{ position: "relative", zIndex: 1, maxWidth: "900px", margin: "0 auto", padding: "16px", display: "flex", flexDirection: "column", gap: "24px" }}>
            
            {/* --- EN-TÊTE ET NAVIGATION --- */}
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#0f2d1e", padding: "12px 20px", borderRadius: "12px", border: "1px solid #2d5a3d" }}>
              <div style={{ display: "flex", gap: "10px" }}>
                <button onClick={() => setTab("saisie")} style={{ padding: "8px 16px", borderRadius: "8px", background: tab === "saisie" ? "#4ade80" : "transparent", color: tab === "saisie" ? "#052e16" : "#4ade80", border: tab === "saisie" ? "none" : "1px solid #2d5a3d", fontFamily: "Tahoma", fontWeight: 700, cursor: "pointer" }}>Saisie</button>
                <button onClick={() => setTab("historique")} style={{ padding: "8px 16px", borderRadius: "8px", background: tab === "historique" ? "#4ade80" : "transparent", color: tab === "historique" ? "#052e16" : "#4ade80", border: tab === "historique" ? "none" : "1px solid #2d5a3d", fontFamily: "Tahoma", fontWeight: 700, cursor: "pointer" }}>Historique</button>
              </div>
              <button onClick={() => setConfirmReset(true)} style={{ padding: "8px 16px", borderRadius: "8px", background: "#7f1d1d", color: "#fca5a5", border: "none", fontFamily: "Tahoma", fontWeight: 700, cursor: "pointer" }}>Quitter</button>
            </div>

            {/* --- CONFIRMATION DE SORTIE --- */}
            {confirmReset && (
              <div style={{ background: "#7f1d1d22", border: "1px solid #ef4444", borderRadius: "12px", padding: "16px", textAlign: "center" }}>
                <div style={{ color: "#fca5a5", fontFamily: "Tahoma", fontWeight: 700, marginBottom: "12px" }}>Voulez-vous vraiment quitter ? La partie en cours sera perdue.</div>
                <div style={{ display: "flex", gap: "10px", justifyContent: "center" }}>
                  <button onClick={reset} style={{ padding: "8px 16px", borderRadius: "6px", background: "#ef4444", color: "#fff", border: "none", fontWeight: 700, cursor: "pointer" }}>Oui, quitter</button>
                  <button onClick={() => setConfirmReset(false)} style={{ padding: "8px 16px", borderRadius: "6px", background: "transparent", border: "1px solid #fca5a5", color: "#fca5a5", fontWeight: 700, cursor: "pointer" }}>Annuler</button>
                </div>
              </div>
            )}

            {/* --- CARTES DES JOUEURS / ÉQUIPES --- */}
            <div style={{ display: "grid", gridTemplateColumns: `repeat(auto-fit, minmax(120px, 1fr))`, gap: "12px" }}>
              {players.map((p, i) => (
                <PlayerCard 
                  key={p.id} 
                  player={p} 
                  colorInfo={SUIT_COLORS[i % SUIT_COLORS.length]} 
                  rank={getRank(p.id)} 
                  total={totalScore(rounds, p.id)} 
                  onNameChange={(newName) => updateName(p.id, newName)} 
                />
              ))}
            </div>

            {/* --- CONTENU PRINCIPAL --- */}
            {tab === "saisie" ? (
              gameMode === "libre" ? <RoundInputClassic players={players} roundNumber={rounds.length + 1} onValidate={addRound} />
              : gameMode === "tarot" ? <RoundInputTarot players={players} roundNumber={rounds.length + 1} onValidate={addRound} />
              : <RoundInputBelote players={players} roundNumber={rounds.length + 1} onValidate={addRound} />
            ) : (
              <div style={{ display: "flex", flexDirection: "column", gap: "24px" }}>
                <div style={{ background: "rgba(0,0,0,0.35)", border: "1px solid #2d5a3d", borderRadius: "14px", padding: "16px" }}>
                  <div style={{ fontFamily: "Tahoma", fontWeight: 700, color: "#4ade80", fontSize: "14px", marginBottom: "16px" }}>Évolution des scores</div>
                  <EvolutionChart players={players} rounds={rounds} />
                </div>
                <div style={{ background: "rgba(0,0,0,0.35)", border: "1px solid #2d5a3d", borderRadius: "14px", padding: "16px" }}>
                  <div style={{ fontFamily: "Tahoma", fontWeight: 700, color: "#4ade80", fontSize: "14px", marginBottom: "16px" }}>Tableau des manches</div>
                  <HistoryTable rounds={rounds} players={players} onDelete={deleteRound} />
                </div>
              </div>
            )}

          </div>
          )}
        </>
      );
    }
    
// --- MODE BELOTE ---
    function RoundInputBelote({ players, roundNumber, onValidate }) {
      // players contient désormais les 2 équipes
      const [preneur, setPreneur] = useState(players[0]?.id); 
      const [points, setPoints] = useState("");
      const [belote, setBelote] = useState("none"); // "none", "attaque", "defense"
      const [capot, setCapot] = useState("none"); // "none", "attaque", "defense"

      const calculate = () => {
        let pts = parseInt(points, 10);
        if (isNaN(pts) && capot === "none") return;

        let scoreAttaque = 0;
        let scoreDefense = 0;

        // Gestion du Capot
        if (capot === "attaque") {
          scoreAttaque = 252;
          scoreDefense = 0;
        } else if (capot === "defense") {
          scoreAttaque = 0;
          scoreDefense = 252;
        } else {
          // Points normaux
          let ptsAttaque = pts;
          let ptsDefense = 162 - pts;

          // Vérification de la chute (Dedans)
          if (ptsAttaque <= 81) {
            scoreAttaque = 0;
            scoreDefense = 162; // La défense marque tous les points
          } else {
            scoreAttaque = ptsAttaque;
            scoreDefense = ptsDefense;
          }
        }

        // Ajout de la Belote/Rebelote
        if (belote === "attaque") scoreAttaque += 20;
        if (belote === "defense") scoreDefense += 20;

        // Répartition des points par équipe
        const scores = {};
        players.forEach(p => {
          if (p.id === preneur) {
            scores[p.id] = scoreAttaque;
          } else {
            scores[p.id] = scoreDefense;
          }
        });
        
        onValidate(scores);
        setPoints("");
        setCapot("none");
        setBelote("none");
      };

      const btnStyle = (active, color = "#4ade80") => ({ padding: "6px 10px", borderRadius: "6px", fontFamily: "Tahoma", fontSize: "12px", fontWeight: 700, cursor: "pointer", border: active ? `1px solid ${color}` : "1px solid #2d5a3d", background: active ? `${color}22` : "transparent", color: active ? color : "#2d5a3d" });

      return (
        <div style={{ background: "rgba(0,0,0,0.35)", border: "1px solid #2d5a3d", borderRadius: "14px", overflow: "hidden" }}>
          <div style={{ background: "rgba(0,0,0,0.3)", borderBottom: "1px solid #2d5a3d", padding: "10px 16px", display: "flex", alignItems: "center", gap: "10px" }}>
            <span style={{ fontSize: "18px" }}>♠️</span><span style={{ fontFamily: "Tahoma", fontWeight: 700, color: "#4ade80", fontSize: "14px" }}>Manche {roundNumber} (Calcul Belote)</span>
          </div>
          
          <div style={{ padding: "16px", display: "flex", flexDirection: "column", gap: "16px" }}>
            
            {/* L'équipe Attaquante */}
            <div style={{ display: "flex", gap: "10px", flexWrap: "wrap" }}>
              <div style={{ flex: 1, minWidth: "140px" }}>
                <div style={{ fontSize: "10px", color: "#4ade8066", textTransform: "uppercase", marginBottom: "4px", fontFamily: "Tahoma" }}>Équipe Preneuse (Attaque)</div>
                <select value={preneur} onChange={e => setPreneur(parseInt(e.target.value))} style={{ width: "100%", padding: "8px", borderRadius: "6px", background: "#0f2d1e", color: "#a7f3d0", border: "1px solid #2d5a3d", fontFamily: "Tahoma" }}>
                  {players.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                </select>
              </div>
            </div>

            {/* Options Spéciales */}
            <div>
              <div style={{ fontSize: "10px", color: "#4ade8066", textTransform: "uppercase", marginBottom: "6px", fontFamily: "Tahoma" }}>Belote et Rebelote (+20)</div>
              <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
                <button onClick={() => setBelote("none")} style={btnStyle(belote === "none")}>Aucune</button>
                <button onClick={() => setBelote("attaque")} style={btnStyle(belote === "attaque")}>Attaque</button>
                <button onClick={() => setBelote("defense")} style={btnStyle(belote === "defense", "#f87171")}>Défense</button>
              </div>
            </div>

            <div>
              <div style={{ fontSize: "10px", color: "#4ade8066", textTransform: "uppercase", marginBottom: "6px", fontFamily: "Tahoma" }}>Capot (252 pts)</div>
              <div style={{ display: "flex", gap: "6px", flexWrap: "wrap" }}>
                <button onClick={() => setCapot("none")} style={btnStyle(capot === "none")}>Aucun</button>
                <button onClick={() => setCapot("attaque")} style={btnStyle(capot === "attaque")}>Attaque</button>
                <button onClick={() => setCapot("defense")} style={btnStyle(capot === "defense", "#f87171")}>Défense</button>
              </div>
            </div>

            {/* Points */}
            {capot === "none" && (
              <div>
                <div style={{ fontSize: "10px", color: "#4ade8066", textTransform: "uppercase", marginBottom: "6px", fontFamily: "Tahoma" }}>Points de l'attaque (sans belote, max 162)</div>
                <input type="number" value={points} onChange={e => setPoints(e.target.value)} placeholder="Ex: 92" onKeyDown={e => { if (e.key === "Enter") calculate(); }}
                  style={{ width: "100px", background: "#1a473144", border: "1.5px solid #4ade8088", borderRadius: "8px", color: "#4ade80", fontFamily: "Tahoma", fontWeight: 700, fontSize: "16px", textAlign: "center", padding: "8px", outline: "none" }} />
              </div>
            )}
          </div>

          <div style={{ padding: "12px 16px", borderTop: "1px solid #2d5a3d22", display: "flex", justifyContent: "flex-end" }}>
            <button onClick={calculate} disabled={points === "" && capot === "none"} style={{ padding: "10px 28px", borderRadius: "8px", background: (points === "" && capot === "none") ? "#1a3326" : "#4ade80", border: "none", color: (points === "" && capot === "none") ? "#2d5a3d" : "#052e16", fontFamily: "Tahoma", fontWeight: 700, cursor: (points === "" && capot === "none") ? "default" : "pointer" }}>✦ CALCULER & VALIDER</button>
          </div>
        </div>
      );
    }
    
    // --- INITIALISATION REACT ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
